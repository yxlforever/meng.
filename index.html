    .message-area { display: flex; flex: 1; flex-direction: column; gap: 12px; padding: 25px 6px 110px; overflow-y: auto; }
    .message { display: flex; max-width: 82%; align-items: flex-end; gap: 8px; }
    .message.incoming { align-self: flex-start; }
    .message.outgoing { align-self: flex-end; flex-direction: row-reverse; }
    .message-avatar { display: grid; width: 34px; height: 34px; flex: 0 0 34px; place-items: center; overflow: hidden; border-radius: 50%; background: #d1d1ce; color: #8c8c88; }
    .message-avatar svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .message-bubble { padding: 10px 13px; border-radius: 6px 15px 15px 15px; background: #fff; color: #333331; font-size: 14px; line-height: 1.5; box-shadow: 0 2px 8px rgba(30,30,28,.05); }
    .message.outgoing .message-bubble { border-radius: 15px 6px 15px 15px; background: #d8d8d5; }
    .message-form {
      position: sticky;
      bottom: calc(10px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      margin: 0 6px;
      padding: 12px 12px 12px 10px;
      border: 1px solid rgba(255,255,255,.46);
      border-radius: 26px;
      background: rgba(255,255,255,.42);
      box-shadow: 0 12px 30px rgba(28,28,26,.12);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
    }
    .message-tools { display: flex; align-items: center; gap: 8px; }
    .message-tool,
    .message-send {
      display: grid;
      place-items: center;
      border: 0;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease, color .18s ease;
    }
    .message-tool {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.5);
      color: #41413d;
    }
    .message-tool:hover,
    .message-send:hover { transform: translateY(-1px); }
    .message-tool:focus-visible,
    .message-send:focus-visible,
    .message-input:focus-visible { outline: 2px solid rgba(22,22,22,.4); outline-offset: 2px; }
    .message-tool svg,
    .message-send svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .message-input {
      min-width: 0;
      width: 100%;
      height: 42px;
      padding: 0 16px;
      border: 1px solid rgba(245,245,242,.9);
      border-radius: 22px;
      outline: 0;
      background: rgba(255,255,255,.8);
      color: var(--ink);
      font-size: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }
    .message-input::placeholder { color: #9b9b95; }
    .message-input:focus { border-color: rgba(130,130,124,.6); background: rgba(255,255,255,.92); }
    .message-send {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      background: linear-gradient(180deg, #2a2a29 0%, #111110 100%);
      color: #fff;
      box-shadow: 0 8px 18px rgba(17,17,16,.24);
    }
    .message-send:hover { box-shadow: 0 10px 20px rgba(17,17,16,.3); }
    .message-send:active { transform: translateY(0); }
    body.show-settings .home-shell, body.show-chat .home-shell, body.show-thread .home-shell, body.show-thread #chatPage, body.show-thread-settings .home-shell, body.show-thread-settings #chatPage, body.show-thread-settings #threadPage { display: none; }

    @media (min-width: 600px) {
      .notes-card { width: calc(100% + 84px); margin-right: -42px; margin-left: -42px; padding-right: 42px; padding-left: 42px; }
      .thread-settings-card { width: calc(100% + 84px); margin-right: -42px; margin-left: -42px; padding-right: 42px; padding-left: 42px; }
      .thread-settings-back { left: -37px; }
      .thread-settings-save { right: -34px; }
    }

    .panel.open { transform: translate(-50%, 0); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; }
    .panel-title { margin: 0; font-size: 17px; font-weight: 650; }
    .close { padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; }
    .close:hover { color: var(--ink); }
    .panel-copy { margin: 13px 0 0; color: #6e6e69; font-size: 12px; line-height: 1.7; }
    .panel-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 19px; padding-top: 15px; border-top: 1px solid var(--line); font-size: 12px; }
    .toggle { width: 39px; height: 23px; padding: 3px; border: 0; border-radius: 14px; background: #d3d3ce; cursor: pointer; transition: background .2s ease; }
    .toggle span { display: block; width: 17px; height: 17px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: transform .2s ease; }
    .toggle.on { background: var(--ink); }
    .toggle.on span { transform: translateX(16px); }

    @media (min-width: 600px) {
      .home-shell { padding-left: 42px; padding-right: 42px; }
      .profile-wrap { margin-top: 32px; }
      .profile-card { padding: 26px 28px 18px; }
      .apps { gap: 22px; }

      .app-icon { width: 60px; height: 60px; }
    }

    @media (max-height: 660px) {
      .profile-wrap { margin-top: 14px; }
      .profile-card { padding: 16px 16px 12px; }

      .profile-name { font-size: 20px; }

    }
  </style>
</head>

  <script>
    const DATABASE_NAME = 'mono-desk';
    const STORE_NAME = 'preferences';
    const STATE_ID = 'current';
    const defaultState = {
      profileName: '사랑해요',
      profileHandle: '@mono.space',
      profileBio: '好好生活，慢慢相遇。',
      activeDay: '1',
      toggles: {},
      avatar: null,
      conversations: []
    };
    const state = { ...defaultState };
    let database;

    const openDatabase = () => new Promise((resolve, reject) => {
      const request = indexedDB.open(DATABASE_NAME, 1);
      request.onupgradeneeded = () => request.result.createObjectStore(STORE_NAME, { keyPath: 'id' });
      request.onsuccess = () => {
        database = request.result;
        resolve();
      };
      request.onerror = () => reject(request.error);
    });

    const readState = () => new Promise((resolve, reject) => {
      const request = database.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(STATE_ID);
      request.onsuccess = () => resolve(request.result?.value || {});
      request.onerror = () => reject(request.error);
    });

    const saveState = () => {
      if (!database) return;
      database.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).put({ id: STATE_ID, value: state });
    };

    const panels = [...document.querySelectorAll('.panel')];
    const closePanels = () => panels.forEach(panel => {
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
    });
    const openPanel = panelId => {
      closePanels();
      const panel = document.getElementById(panelId);
      panel.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
    };

    document.querySelectorAll('[data-panel]').forEach(button => button.addEventListener('click', () => openPanel(button.dataset.panel)));

    document.getElementById('settingsApp').addEventListener('click', () => {
      document.body.classList.add('show-settings');
      document.getElementById('settingsPage').classList.add('active');
    });
    document.getElementById('chatApp').addEventListener('click', () => {
      document.body.classList.add('show-chat');
      document.getElementById('chatPage').classList.add('active');
    });
    const returnHome = () => {
      document.body.classList.remove('show-chat');
      document.getElementById('chatPage').classList.remove('active');
    };
    const chatBack = document.getElementById('chatBack');
    chatBack.addEventListener('click', returnHome);
    const noteModal = document.getElementById('noteModal');
    const noteForm = document.getElementById('noteForm');
    const noteNameInput = document.getElementById('noteNameInput');
    const conversationList = document.getElementById('conversationList');
    const defaultAvatar = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20c.7-3.6 3.1-5.4 6.5-5.4s5.8 1.8 6.5 5.4"/></svg>';
    const renderConversations = () => {
      conversationList.replaceChildren();
      state.conversations.forEach(conversation => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'conversation-item';
        item.setAttribute('aria-label', `打开与${conversation.name}的对话`);
        item.innerHTML = `<span class="conversation-avatar">${avatarMarkup(conversation.chatAvatar)}</span><span class="conversation-name"></span>`;
        item.querySelector('.conversation-name').textContent = conversation.name;
        item.addEventListener('click', () => openThread(conversation));
        conversationList.append(item);
      });
    };
    const threadPage = document.getElementById('threadPage');
    const threadName = document.getElementById('threadName');
    const threadAvatar = document.getElementById('threadAvatar');
    const messageArea = document.getElementById('messageArea');
    const messageInput = document.getElementById('messageInput');
    const renderMessages = conversation => {
      messageArea.replaceChildren();
      (conversation.messages || []).forEach(message => {
        const item = document.createElement('div');
        item.className = `message ${message.mine ? 'outgoing' : 'incoming'}`;
        const messageAvatar = message.mine ? conversation.userAvatar : conversation.chatAvatar;
        item.innerHTML = `<span class="message-avatar">${avatarMarkup(messageAvatar)}</span><span class="message-bubble"></span>`;
        item.querySelector('.message-bubble').textContent = message.text;
        messageArea.append(item);
      });
      messageArea.scrollTop = messageArea.scrollHeight;
    };
    const replyEmojis = ['🙂', '😊', '🥰', '😌', '✨', '🌙', '💭', '🤍'];
    const randomBetween = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const scheduleAutoReplies = conversation => {
      const cards = (conversation.replyCards || []).filter(Boolean);
      if (!cards.length) return;
      const count = Math.min(99, Math.max(1, Number(conversation.replyCount) || 1));
      const minDelay = Math.max(1, Number(conversation.replyMin) || 3);
      const maxDelay = Math.max(minDelay, Number(conversation.replyMax) || 10);
      const emojiProbability = Math.min(100, Math.max(0, Number(conversation.emojiProbability) || 0));
      conversation.pendingReplies = (conversation.pendingReplies || 0) + count;
      const sendReply = index => {
        if (index >= count) {
          conversation.pendingReplies = Math.max(0, (conversation.pendingReplies || 0) - count);
          saveState();
          return;
        }
        const delay = randomBetween(minDelay, maxDelay) * 1000;
        window.setTimeout(() => {
          const card = cards[randomBetween(0, cards.length - 1)];
          const text = Math.random() * 100 < emojiProbability
            ? `${card} ${replyEmojis[randomBetween(0, replyEmojis.length - 1)]}`
            : card;
          conversation.messages = conversation.messages || [];
          conversation.messages.push({ text, mine: false });
          if (state.currentConversationId === conversation.id) renderMessages(conversation);
          saveState();
          sendReply(index + 1);
        }, delay);
      };
      sendReply(0);
    };
    const openThread = conversation => {
      state.currentConversationId = conversation.id;
      threadName.textContent = conversation.name;
      threadAvatar.innerHTML = avatarMarkup(conversation.chatAvatar);
      renderMessages(conversation);
      document.body.classList.add('show-thread');
      threadPage.classList.add('active');
      messageInput.focus();
    };
    const closeThread = () => {
      document.body.classList.remove('show-thread');
      threadPage.classList.remove('active');
    };
    document.getElementById('threadBack').addEventListener('click', closeThread);
    const threadSettingsPage = document.getElementById('threadSettingsPage');
    const threadSettingsNameInput = document.getElementById('threadSettingsNameInput');
    const threadChatAvatar = document.getElementById('threadChatAvatar');
    const threadUserAvatar = document.getElementById('threadUserAvatar');
    const threadAvatarInput = document.getElementById('threadAvatarInput');
    const replyCountValue = document.getElementById('replyCountValue');
    const replyMinInput = document.getElementById('replyMinInput');
    const replyMaxInput = document.getElementById('replyMaxInput');
    const emojiProbabilityInput = document.getElementById('emojiProbabilityInput');
    const cardLibraryModal = document.getElementById('cardLibraryModal');
    const cardLibraryDialog = document.getElementById('cardLibraryDialog');
    const cardLibraryList = document.getElementById('cardLibraryList');
    const cardLibraryEditor = document.getElementById('cardLibraryEditor');
    const cardLibraryFile = document.getElementById('cardLibraryFile');
    let selectedAvatarTarget = null;
    let cardLibraryDraft = [];
    const renderCardLibrary = cards => {
      cardLibraryList.replaceChildren();
      (cards.length ? cards : ['暂无字卡']).forEach(text => {
        const item = document.createElement('div');
        item.className = 'card-library-item';
        item.textContent = text;
        cardLibraryList.append(item);
      });
    };
    const openCardLibrary = () => {
      const conversation = state.conversations.find(item => item.id === state.currentConversationId);
      if (!conversation) return;
      cardLibraryDraft = [...(conversation.replyCards || [])];
      renderCardLibrary(cardLibraryDraft);
      cardLibraryDialog.classList.remove('editing');
      cardLibraryModal.classList.add('open');
      cardLibraryModal.setAttribute('aria-hidden', 'false');
    };
    const closeCardLibrary = () => {
      cardLibraryModal.classList.remove('open');
      cardLibraryModal.setAttribute('aria-hidden', 'true');
    };
    const avatarMarkup = source => source ? `<img src="${source}" alt="" />` : defaultAvatar;
    const openThreadSettings = () => {
      const conversation = state.conversations.find(item => item.id === state.currentConversationId);
      if (!conversation) return;
      threadSettingsNameInput.value = conversation.name;
      threadChatAvatar.innerHTML = avatarMarkup(conversation.chatAvatar);
      threadUserAvatar.innerHTML = avatarMarkup(conversation.userAvatar);
      replyCountValue.textContent = conversation.replyCount || 1;
      replyMinInput.value = conversation.replyMin || 3;
      replyMaxInput.value = conversation.replyMax || 10;
      emojiProbabilityInput.value = conversation.emojiProbability ?? 20;
      document.body.classList.add('show-thread-settings');
      threadSettingsPage.classList.add('active');
    };
    const closeThreadSettings = () => {
      document.body.classList.remove('show-thread-settings');
      threadSettingsPage.classList.remove('active');
    };
    threadAvatar.addEventListener('click', openThreadSettings);
    document.getElementById('threadSettingsBack').addEventListener('click', closeThreadSettings);
    document.getElementById('threadSettingsSave').addEventListener('click', () => {
      const conversation = state.conversations.find(item => item.id === state.currentConversationId);
      const name = threadSettingsNameInput.value.trim();
      if (!conversation || !name) return;
      conversation.name = name;
      conversation.replyCount = Math.max(1, Number(replyCountValue.textContent) || 1);
      conversation.replyMin = Math.max(1, Number(replyMinInput.value) || 3);
      conversation.replyMax = Math.max(conversation.replyMin, Number(replyMaxInput.value) || 10);
      conversation.emojiProbability = Math.min(100, Math.max(0, Number(emojiProbabilityInput.value) || 0));
      threadName.textContent = name;
      renderConversations();
      renderMessages(conversation);
      saveState();
      closeThreadSettings();
    });
    document.getElementById('openCardLibrary').addEventListener('click', openCardLibrary);
    cardLibraryModal.addEventListener('click', event => {
      if (event.target === cardLibraryModal) closeCardLibrary();
    });
    document.getElementById('cardLibraryEdit').addEventListener('click', () => {
      cardLibraryEditor.value = cardLibraryDraft.join('\n');
      cardLibraryDialog.classList.add('editing');
      cardLibraryEditor.focus();
    });
    document.getElementById('cardLibrarySave').addEventListener('click', () => {
      const conversation = state.conversations.find(item => item.id === state.currentConversationId);
      if (cardLibraryDialog.classList.contains('editing')) {
        cardLibraryDraft = cardLibraryEditor.value.split(/\r?\n/).map(item => item.trim()).filter(Boolean);
        renderCardLibrary(cardLibraryDraft);
        cardLibraryDialog.classList.remove('editing');
      }
      if (conversation) {
        conversation.replyCards = [...cardLibraryDraft];
        saveState();
      }
      closeCardLibrary();
    });
    document.getElementById('cardLibraryImport').addEventListener('click', () => cardLibraryFile.click());
    cardLibraryFile.addEventListener('change', event => {
      const [file] = event.target.files;
      if (!file) return;
      const reader = new FileReader();
      reader.addEventListener('load', () => {
        cardLibraryDraft = String(reader.result || '').split(/\r?\n/).map(item => item.trim()).filter(Boolean);
        renderCardLibrary(cardLibraryDraft);
        cardLibraryFile.value = '';
      });
      reader.readAsText(file);
    });
    document.getElementById('cardLibraryExport').addEventListener('click', () => {
      const blob = new Blob([cardLibraryDraft.join('\n')], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = '字卡库.txt';
      link.click();
      URL.revokeObjectURL(url);
    });
    document.getElementById('replyCountDown').addEventListener('click', () => {
      replyCountValue.textContent = Math.max(1, Number(replyCountValue.textContent) - 1);
    });
    document.getElementById('replyCountUp').addEventListener('click', () => {
      replyCountValue.textContent = Math.min(99, Number(replyCountValue.textContent) + 1);
    });
    threadSettingsNameInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        document.getElementById('threadSettingsSave').click();
      }
    });
    [threadChatAvatar, threadUserAvatar].forEach(button => button.addEventListener('click', () => {
      selectedAvatarTarget = button === threadChatAvatar ? 'chatAvatar' : 'userAvatar';
      threadAvatarInput.click();
    }));
    threadAvatarInput.addEventListener('change', () => {
      const file = threadAvatarInput.files[0];
      const conversation = state.conversations.find(item => item.id === state.currentConversationId);
      if (!file || !conversation || !selectedAvatarTarget) return;
      const reader = new FileReader();
      reader.addEventListener('load', () => {
        conversation[selectedAvatarTarget] = reader.result;
        threadChatAvatar.innerHTML = avatarMarkup(conversation.chatAvatar);
        threadUserAvatar.innerHTML = avatarMarkup(conversation.userAvatar);
        threadAvatar.innerHTML = avatarMarkup(conversation.chatAvatar);
        renderConversations();
        renderMessages(conversation);
        saveState();
        threadAvatarInput.value = '';
      });
      reader.readAsDataURL(file);
    });
    document.getElementById('messageForm').addEventListener('submit', event => {
      event.preventDefault();
      const text = messageInput.value.trim();
      const conversation = state.conversations.find(item => item.id === state.currentConversationId);
      if (!text || !conversation) return;
      conversation.messages = conversation.messages || [];
      conversation.messages.push({ text, mine: true });
      messageInput.value = '';
      renderMessages(conversation);
      saveState();
      if (conversation.autoReply !== false) scheduleAutoReplies(conversation);
    });
    const closeNoteModal = () => {
      noteModal.classList.remove('open');
      noteModal.setAttribute('aria-hidden', 'true');
      noteNameInput.value = '';
    };
    document.querySelector('.notes-heart').addEventListener('click', () => {
      noteModal.classList.add('open');
      noteModal.setAttribute('aria-hidden', 'false');
      noteNameInput.focus();
    });
    document.getElementById('noteCancel').addEventListener('click', closeNoteModal);
    noteModal.addEventListener('click', event => {
      if (event.target === noteModal) closeNoteModal();
    });
    noteForm.addEventListener('submit', event => {
      event.preventDefault();
      const name = noteNameInput.value.trim();
      if (!name) return;
      state.conversations.push({ id: crypto.randomUUID(), name, messages: [] });
      renderConversations();
      saveState();
      closeNoteModal();
    });
    chatBack.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        returnHome();
      }
    });
    document.querySelectorAll('.close').forEach(button => button.addEventListener('click', closePanels));
    document.querySelectorAll('.toggle').forEach((toggle, index) => {
      const toggleKey = toggle.closest('.panel').id + '-' + index;
      toggle.dataset.storageKey = toggleKey;
      toggle.classList.toggle('on', state.toggles[toggleKey] ?? toggle.classList.contains('on'));
      toggle.addEventListener('click', () => {
        toggle.classList.toggle('on');
        state.toggles[toggleKey] = toggle.classList.contains('on');
        saveState();
      });
    });

    document.querySelectorAll('[contenteditable="true"]').forEach(field => {
      field.textContent = state[field.id];
      field.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          field.blur();
        }
      });
      field.addEventListener('blur', () => {
        const fallback = field.id === 'profileName'
          ? defaultState.profileName
          : field.id === 'profileHandle'
            ? defaultState.profileHandle
            : defaultState.profileBio;
        field.textContent = field.textContent.trim() || fallback;
        state[field.id] = field.textContent;
        saveState();
      });
    });

    document.querySelectorAll('.day').forEach(day => {
      day.classList.toggle('active', day.dataset.day === state.activeDay);
      day.addEventListener('click', () => {
        document.querySelectorAll('.day').forEach(item => item.classList.remove('active'));
        day.classList.add('active');
        state.activeDay = day.dataset.day;
        saveState();
      });
    });

    const avatarInput = document.getElementById('avatarInput');
    const avatarButton = document.getElementById('avatarButton');
    const avatarImage = document.getElementById('avatarImage');
    const setAvatar = avatar => {
      avatarImage.src = URL.createObjectURL(avatar);
      avatarImage.classList.add('has-image');
      state.avatar = avatar;
      saveState();
    };
    avatarButton.addEventListener('click', () => avatarInput.click());
    avatarInput.addEventListener('change', event => {
      const [file] = event.target.files;
      if (!file) return;
      setAvatar(file);
    });

    const applySavedState = savedState => {
      Object.assign(state, savedState);
      document.querySelectorAll('[contenteditable="true"]').forEach(field => {
        field.textContent = state[field.id];
      });
      document.querySelectorAll('.day').forEach(day => {
        day.classList.toggle('active', day.dataset.day === state.activeDay);
      });
      document.querySelectorAll('.toggle').forEach(toggle => {
        const toggleKey = toggle.dataset.storageKey;
        toggle.classList.toggle('on', state.toggles[toggleKey] ?? toggle.classList.contains('on'));
      });
      if (state.avatar) {
        avatarImage.src = URL.createObjectURL(state.avatar);
        avatarImage.classList.add('has-image');
      }
      renderConversations();
    };

    openDatabase().then(readState).then(applySavedState).catch(error => {
      console.warn('无法初始化浏览器数据库，将不会保存数据。', error);
    });
  </script>
</body>
</html>
